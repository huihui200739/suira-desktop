<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>随序 动作面板</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="quickpanel.css">
  <link rel="stylesheet" href="ui-motion.css">
</head>
<body>
  <main class="panel" id="panel" data-mode="actions" aria-label="随序动作面板">
    <header class="panel-head">
      <div class="panel-brand" aria-label="随序 随手工作台"><span class="brand-symbol" aria-hidden="true"><img src="../assets/suira-icon.png" alt="" width="44" height="44"></span><span><b>随序</b><small>随手工作台</small></span></div>
      <div class="search-field" data-glass>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 4 4"/></svg>
        <input id="search" type="text" autocomplete="off" spellcheck="false" placeholder="按空格查看全部应用" aria-label="搜索命令、应用或内容">
        <kbd class="search-mode" id="mode-chip">动作</kbd>
      </div>
      <div class="panel-modes" data-selection-group aria-label="面板模式">
        <button id="mode-actions" type="button" aria-pressed="true">动作</button>
        <button id="mode-apps" type="button" aria-pressed="false">应用</button>
      </div>
      <button class="toolbox-btn" id="toolbox" data-glass type="button" aria-label="打开工具箱" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="7" width="7" height="7" rx="1.6"/><rect x="13.5" y="7" width="7" height="7" rx="1.6"/><rect x="3.5" y="16" width="7" height="4.5" rx="1.4"/><rect x="13.5" y="16" width="7" height="4.5" rx="1.4"/></svg>
        <span>工具箱</span>
      </button>
    </header>

    <section class="panel-body" id="panel-body">
      <!-- 动作面板：38 键固定布局 -->
      <div class="keyboard" id="key-grid" aria-label="38 键动作面板"></div>

      <!-- 应用面板：空格切换 -->
      <section class="apps" id="apps-panel" hidden aria-label="应用面板">
        <div class="apps-grid" id="apps-grid"></div>
        <div class="empty-state" id="empty-state" hidden role="status">
          <b id="empty-title">应用索引还没有准备好</b>
          <p id="empty-description">首次启动会扫描开始菜单，稍后再按空格查看应用。</p>
          <button id="apps-retry" class="pager-btn" type="button" hidden>重试</button>
        </div>
        <div class="apps-foot">
          <button class="pager-btn" id="apps-prev" type="button" aria-label="上一页">‹</button>
          <span class="pager-text" id="apps-pager">第 1 / 1 页</span>
          <button class="pager-btn" id="apps-next" type="button" aria-label="下一页">›</button>
        </div>
      </section>

      <!-- 工具箱 -->
      <section class="toolbox" id="toolbox-panel" hidden aria-label="工具箱">
        <div class="tool-grid" id="tool-grid"></div>
      </section>

      <!-- 搜索结果 -->
      <section class="command-section" id="command-section" hidden>
        <div class="command-list" id="command-list"></div>
      </section>
    </section>

    <div class="ocr-panel" id="ocr-panel" hidden>
      <div class="ocr-head">
        <div><span class="eyebrow">本地 OCR</span><b>识别结果</b></div>
        <button type="button" id="ocr-close" aria-label="关闭">×</button>
      </div>
      <textarea id="ocr-text" spellcheck="false" placeholder="识别文字会显示在这里"></textarea>
      <div class="ocr-actions">
        <button type="button" class="quiet" id="ocr-original">查看原图</button>
        <button type="button" class="quiet" id="ocr-merge">合并换行</button>
        <button type="button" class="quiet" id="ocr-shelf">加入任务匣</button>
        <button type="button" class="primary" id="ocr-copy">复制文字</button>
      </div>
    </div>

    <div class="ocr-panel translate-panel" id="translate-panel" hidden>
      <div class="ocr-head">
        <div><span class="eyebrow">TRANSLATE</span><b>翻译结果</b></div>
        <div class="translate-controls">
          <span class="translate-target-label">译为</span>
          <select id="translate-target" aria-label="目标语言"></select>
          <button type="button" id="translate-close" aria-label="关闭">×</button>
        </div>
      </div>
      <div class="translate-split">
        <div class="translate-block">
          <span class="translate-label">原文</span>
          <p class="translate-source" id="translate-source"></p>
        </div>
        <div class="translate-block translate-block-result">
          <span class="translate-label">译文</span>
          <textarea id="translate-text" spellcheck="false" placeholder="译文会显示在这里"></textarea>
        </div>
      </div>
      <div class="ocr-actions">
        <button type="button" class="quiet" id="translate-original" hidden>查看原图</button>
        <button type="button" class="quiet" id="translate-shelf">加入任务匣</button>
        <button type="button" class="primary" id="translate-copy">复制译文</button>
      </div>
    </div>

    <footer class="panel-foot">
      <div class="foot-hints">
        <span><kbd>空格</kbd> 切换应用</span>
        <span><kbd>字母</kbd> 直达动作</span>
        <span><kbd>右键</kbd> 改键位</span>
        <span><kbd>Esc</kbd> 关闭</span>
      </div>
      <button class="clipboard-chip" id="open-clipboard" type="button" data-glass aria-label="打开底部剪贴板历史横栏"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5.5" y="4.5" width="13" height="16" rx="2.5"/><path d="M9 4.5V3.2h6v1.3M9 10h6M9 14h4"/></svg>剪贴板</button>
      <button class="capture-chip" id="capture" type="button"><span>⌁</span> 截图 <kbd id="capture-kbd">Ctrl Shift A</kbd></button>
    </footer>

    <!-- 键位绑定编辑器：右键或点击未绑定键时出现 -->
    <div class="binding-editor" id="binding-editor" hidden role="dialog" aria-label="键位绑定">
      <div class="binding-card">
        <header class="binding-head">
          <b>键位 <span class="binding-key" id="binding-key">—</span></b>
          <button type="button" id="binding-close" aria-label="关闭">×</button>
        </header>
        <div class="binding-section-title">内置动作（指派到别的键会与这个键互换）</div>
        <div class="binding-action-grid" id="binding-action-list"></div>
        <div class="binding-section-title">绑定到本机或网页</div>
        <div class="binding-custom-row">
          <button type="button" id="binding-app">应用…</button>
          <button type="button" id="binding-folder">文件夹…</button>
          <button type="button" id="binding-file">文件…</button>
          <button type="button" id="binding-url">网页…</button>
        </div>
        <div class="binding-url-row" id="binding-url-row" hidden>
          <input id="binding-url-input" type="text" autocomplete="off" spellcheck="false" placeholder="粘贴网址，如 https://github.com">
          <button type="button" id="binding-url-save">绑定</button>
        </div>
        <footer class="binding-foot">
          <span class="binding-hint" id="binding-hint">选择要绑到这个键上的内容</span>
          <button type="button" class="binding-clear" id="binding-clear">清除绑定</button>
        </footer>
      </div>
    </div>

    <div class="toast" id="toast" role="status"></div>
  </main>
  <script src="ui-motion.js"></script>
  <script src="quickpanel.js"></script>
</body>
</html>
