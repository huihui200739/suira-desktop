<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>随序 · 文字工具</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="tool-art.css"><link rel="stylesheet" href="utility-surface.css"><link rel="stylesheet" href="ui-motion.css"><link rel="stylesheet" href="glass-select.css">
</head>
<body>
<main class="utility-window">
 <header class="utility-head"><span id="tool-mark" class="utility-mark" aria-hidden="true"></span><h1 id="tool-title">文字工具</h1><div class="utility-window-actions"><button id="tool-min" aria-label="最小化" title="最小化"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button><button id="tool-max" aria-label="最大化" title="最大化"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></button><button id="tool-close" aria-label="关闭" title="关闭"><svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></svg></button></div></header>
 <nav class="text-tool-tabs" role="tablist" aria-label="文字处理方式"><button id="tab-translate" type="button" role="tab" data-tool-mode="translate" aria-selected="false" aria-controls="tool-content">翻译</button><button id="tab-convert" type="button" role="tab" data-tool-mode="convert" aria-selected="true" aria-controls="tool-content">文本转换</button></nav>
 <div id="tool-content" class="text-tool-content" role="tabpanel" aria-labelledby="tab-convert"><div class="text-tool-controls"><div id="language-capsule" class="language-capsule"><label id="source-language-label"><select id="source-language" aria-label="原文语言"><option value="auto">自动识别</option><option value="zh">中文</option><option value="en">英语</option><option value="ja">日语</option><option value="ko">韩语</option><option value="fr">法语</option><option value="de">德语</option><option value="es">西班牙语</option></select></label><button id="swap-languages" class="utility-icon" aria-label="交换原文和译文" title="交换原文和译文"><svg viewBox="0 0 24 24"><path d="M4 8h16m-4-4 4 4-4 4M20 16H4m4-4-4 4 4 4"/></svg></button><label id="target-language-label"><select id="target-language" aria-label="目标语言"></select></label></div><label id="operation-label" hidden>转换方式<select id="operation"><option value="clean">清理多余空白</option><option value="cjk">去除中文之间的空格</option><option value="compact">紧凑段落与中文间距</option><option value="merge">合并段内换行</option><option value="upper">转换为大写</option><option value="lower">转换为小写</option></select></label><button id="tool-configure" class="utility-quiet">翻译服务设置</button></div>
 <div class="text-tool-split"><section><header><label for="tool-source">原文</label><span id="source-count">0 字</span><button id="tool-clipboard">读取剪贴板</button><button id="tool-capture">截图提字</button><details class="text-source-menu"><summary aria-label="更多原文操作" title="更多原文操作">…</summary><div><button id="tool-image">最近图片提字</button></div></details><button id="tool-clear">清空</button></header><textarea id="tool-source" spellcheck="false" maxlength="200000" placeholder="粘贴或输入文字…"></textarea></section><section><header><label for="tool-result" id="result-label">结果</label><span id="result-count">0 字</span><button id="tool-back" hidden>上一步</button><details id="tool-next" class="text-source-menu" hidden><summary>接着处理</summary><div><button data-next-mode="translate">继续翻译</button><button data-next-mode="convert">继续转换</button></div></details></header><textarea id="tool-result" spellcheck="false" maxlength="200000" placeholder="处理结果会显示在这里"></textarea></section></div>
 </div><footer class="text-tool-foot"><div><p id="tool-status" role="status" aria-live="polite"></p><small id="tool-hint">Ctrl + Enter 处理 · 原文保持不变</small></div><button id="tool-run" class="utility-primary">处理</button><button id="tool-copy" class="utility-quiet" disabled>复制结果</button><button id="tool-paste" class="utility-quiet" disabled>粘回原处</button></footer>
</main><script src="tool-art.js"></script><script src="translate-language.js"></script><script src="text-tools.js"></script>
<script src="ui-motion.js"></script><script src="icons.js"></script><script src="glass-select.js"></script></body></html>
