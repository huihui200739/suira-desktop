<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>区域截图</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="overlay.css">
  <link rel="stylesheet" href="image-editor.css">
  <link rel="stylesheet" href="ui-motion.css">
</head>
<body>
  <div id="capture-root">
    <canvas id="screen-canvas"></canvas>
    <canvas id="annotation-canvas"></canvas>
    <!-- 选区外压暗：用 4 块矩形代替 100vmax 的 box-shadow。
         拖动时只重绘选区边缘的条带，不再每帧整屏重绘一次巨大阴影。 -->
    <div class="dim" id="dim-top"></div>
    <div class="dim" id="dim-right"></div>
    <div class="dim" id="dim-bottom"></div>
    <div class="dim" id="dim-left"></div>
    <div class="shade" id="shade"></div>
    <div class="selection" id="selection" hidden>
      <div class="selection-grid"></div>
      <span class="handle nw" data-handle="nw"></span><span class="handle n" data-handle="n"></span><span class="handle ne" data-handle="ne"></span>
      <span class="handle e" data-handle="e"></span><span class="handle se" data-handle="se"></span><span class="handle s" data-handle="s"></span>
      <span class="handle sw" data-handle="sw"></span><span class="handle w" data-handle="w"></span>
      <div class="size-badge" id="size-badge">0 × 0</div>
      <div class="magnifier" id="magnifier"><canvas id="magnifier-canvas" width="144" height="112"></canvas><span id="magnifier-coords">0, 0</span></div>
    </div>

    <div class="capture-hint" id="capture-hint">
      <div class="hint-brand"><img src="../assets/suira-icon.png" alt="" width="18" height="18"><span>区域截图</span></div>
      <p><b>拖拽</b>选择区域</p>
      <span><kbd>Enter</kbd> 完成</span>
      <span><kbd>Esc</kbd> 取消</span>
    </div>

    <div class="tool-dock" id="tool-dock" hidden>
      <div class="tool-tooltip" id="tool-tooltip"></div>
      <button class="tool-button capture-mode" type="button" data-tool="select" data-shortcut="a" title="选择区域"><i aria-hidden="true"></i><span>截图</span></button>
      <span class="tool-separator"></span>
      <button class="tool-button" type="button" data-shortcut="g" data-action="long" title="滚动长截图"><svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M8 7h8M8 10h8M12 13v6m-3-3 3 3 3-3"/></svg></button>
      <button class="tool-button" type="button" data-tool="pen" data-shortcut="p" title="画笔"><svg viewBox="0 0 24 24"><path d="m4 20 3.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20Z"/><path d="m12.8 7.2 3 3"/></svg></button>
      <button class="tool-button" type="button" data-tool="rect" data-shortcut="r" title="矩形"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/></svg></button>
      <button class="tool-button" type="button" data-tool="arrow" data-shortcut="l" title="箭头"><svg viewBox="0 0 24 24"><path d="M5 18 19 5M11 5h8v8"/></svg></button>
      <button class="tool-button" type="button" data-tool="text" data-shortcut="t" title="文字"><svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13M8 19h8"/></svg></button>
      <button class="tool-button" type="button" data-tool="mosaic" data-shortcut="m" title="马赛克"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="4" height="4"/><rect x="12" y="4" width="4" height="4"/><rect x="8" y="8" width="4" height="4"/><rect x="16" y="8" width="4" height="4"/><rect x="4" y="12" width="4" height="4"/><rect x="12" y="12" width="4" height="4"/><rect x="8" y="16" width="4" height="4"/><rect x="16" y="16" width="4" height="4"/></svg></button>
      <button class="tool-button" type="button" data-tool="steps" data-shortcut="n" title="序号"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="m10 10 2-2v8M10 16h4"/></svg></button>
      <span class="tool-separator"></span>
      <div class="color-control">
        <button class="tool-button color-trigger" data-shortcut="c" type="button" title="颜色"><span class="color-dot" id="color-dot"></span></button>
        <div class="color-popover" id="color-popover" hidden>
          <button type="button" data-color="#ff646f" style="--c:#e5484d" aria-label="红色"></button>
          <button type="button" data-color="#ffb457" style="--c:#ffc53d" aria-label="橙色"></button>
          <button type="button" data-color="#6aa7ff" style="--c:#0090ff" aria-label="蓝色"></button>
          <button type="button" data-color="#64dcA2" style="--c:#64dca2" aria-label="绿色"></button>
          <button type="button" data-color="#ffffff" style="--c:#ffffff" aria-label="白色"></button>
          <button type="button" data-color="#171923" style="--c:#1c2024" aria-label="黑色"></button>
        </div>
      </div>
      <button class="tool-button" type="button" data-shortcut="z" data-action="undo" title="撤销"><svg viewBox="0 0 24 24"><path d="M9 7H5v4M5.7 10.2A7 7 0 1 1 7 18"/></svg></button>
      <span class="tool-separator"></span>
      <button class="tool-button" type="button" data-shortcut="escape" data-action="cancel" title="取消"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      <button class="tool-button" type="button" data-shortcut="q" data-action="pin" title="贴图"><svg viewBox="0 0 24 24"><path d="m14 3 7 7-4 1-4 5-5-5 5-4 1-4Z"/><path d="m8 16-5 5"/></svg></button>
      <button class="tool-button" type="button" data-shortcut="s" data-action="save" title="保存"><svg viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M5 17v3h14v-3"/></svg></button>
      <button class="tool-button token-button" type="button" data-action="ocr" data-shortcut="o" title="识别文字"><svg viewBox="0 0 24 24"><path d="M4 8V4h4m8 0h4v4m0 8v4h-4M8 20H4v-4M8 8h8m-4 0v8m-2 0h4"/></svg></button>
      <button class="tool-button complete-button" type="button" data-action="copy" data-shortcut="enter" title="完成并复制"><svg viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></svg></button>
    </div>

    <div class="action-toast" id="action-toast"></div>
    <div class="ocr-result" id="ocr-result" hidden>
      <header class="ocr-result-head">
        <div><b>识别结果</b></div>
        <button type="button" id="ocr-result-close" aria-label="关闭">×</button>
      </header>
      <textarea id="ocr-result-text" spellcheck="false" placeholder="正在识别…"></textarea>
      <footer class="ocr-result-actions">
        <button type="button" class="quiet" id="ocr-result-original">查看原图</button>
        <button type="button" class="quiet" id="ocr-result-retry">重新识别</button>
        <button type="button" class="quiet" id="ocr-result-shelf">加入任务匣</button>
        <button type="button" class="primary" id="ocr-result-copy">复制文字</button>
      </footer>
    </div>
    <div class="text-editor" id="text-editor" hidden>
      <textarea id="text-input" rows="2" placeholder="输入文字"></textarea>
      <div><button type="button" id="text-cancel">取消</button><button type="button" id="text-confirm">确定</button></div>
    </div>
    <div class="original-viewer" id="original-viewer" hidden>
      <header><b>原图</b><small>框选区域的原始画面，不含标注</small><button type="button" id="original-close" aria-label="关闭">×</button></header>
      <div class="original-stage"><img id="original-image" alt="框选区域原图"></div>
    </div>
    <div class="loading-state" id="loading-state"><span></span>正在获取屏幕画面…</div>
  </div>
  <script src="ui-motion.js"></script>
  <script src="image-editor.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
