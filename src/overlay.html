<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>区域截图</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="overlay.css">
  <link rel="stylesheet" href="ui-motion.css">
</head>
<body>
  <div id="capture-root">
    <canvas id="screen-canvas"></canvas>
    <canvas id="annotation-canvas"></canvas>
    <!-- 选区外压暗：用 4 块矩形代替 100vmax 的 box-shadow。
         拖动时只重绘选区边缘的条带，不再每帧整屏重绘一次巨大阴影。 -->
    <div class="dim" id="dim-top"></div>
    <div class="dim" id="dim-right"></div>
    <div class="dim" id="dim-bottom"></div>
    <div class="dim" id="dim-left"></div>
    <div class="shade" id="shade"></div>
    <div class="selection" id="selection" hidden>
      <div class="selection-grid"></div>
      <span class="handle nw" data-handle="nw"></span><span class="handle n" data-handle="n"></span><span class="handle ne" data-handle="ne"></span>
      <span class="handle e" data-handle="e"></span><span class="handle se" data-handle="se"></span><span class="handle s" data-handle="s"></span>
      <span class="handle sw" data-handle="sw"></span><span class="handle w" data-handle="w"></span>
      <div class="size-badge" id="size-badge">0 × 0</div>
      <div class="magnifier" id="magnifier"><canvas id="magnifier-canvas" width="144" height="112"></canvas><span id="magnifier-coords">0, 0</span></div>
    </div>

    <div class="capture-hint" id="capture-hint">
      <div class="hint-brand"><img src="../assets/suira-icon.png" alt="" width="18" height="18"><span>区域截图</span></div>
      <p><b>拖拽</b>选择区域</p>
      <span><kbd>Enter</kbd> 完成</span>
      <span><kbd>Esc</kbd> 取消</span>
    </div>

    <div class="tool-dock" id="tool-dock" hidden>
      <div class="tool-tooltip" id="tool-tooltip"></div>
      <button class="tool-button" type="button" data-tool="select" data-shortcut="a" title="选择区域"><kbd>A</kbd><svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/></svg></button>
      <span class="tool-separator"></span>
      <button class="tool-button" type="button" data-tool="pen" data-shortcut="p" title="画笔"><kbd>P</kbd><svg viewBox="0 0 24 24"><path d="m4 20 3.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20Z"/><path d="m12.8 7.2 3 3"/></svg></button>
      <button class="tool-button" type="button" data-tool="rect" data-shortcut="r" title="矩形"><kbd>R</kbd><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1.5"/></svg></button>
      <button class="tool-button" type="button" data-tool="arrow" data-shortcut="l" title="箭头"><kbd>L</kbd><svg viewBox="0 0 24 24"><path d="M5 18 19 5M11 5h8v8"/></svg></button>
      <button class="tool-button" type="button" data-tool="text" data-shortcut="t" title="文字"><kbd>T</kbd><svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13M8 19h8"/></svg></button>
      <button class="tool-button" type="button" data-tool="mosaic" data-shortcut="m" title="马赛克"><kbd>M</kbd><svg viewBox="0 0 24 24"><rect x="4" y="4" width="4" height="4"/><rect x="12" y="4" width="4" height="4"/><rect x="8" y="8" width="4" height="4"/><rect x="16" y="8" width="4" height="4"/><rect x="4" y="12" width="4" height="4"/><rect x="12" y="12" width="4" height="4"/><rect x="8" y="16" width="4" height="4"/><rect x="16" y="16" width="4" height="4"/></svg></button>
      <button class="tool-button" type="button" data-tool="steps" data-shortcut="n" title="序号"><kbd>N</kbd><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v8M9 11h6"/></svg></button>
      <span class="tool-separator"></span>
      <div class="color-control">
        <button class="tool-button color-trigger" data-shortcut="c" type="button" title="颜色"><kbd>C</kbd><span class="color-dot" id="color-dot"></span></button>
        <div class="color-popover" id="color-popover" hidden>
          <button type="button" data-color="#ff646f" style="--c:#e5484d" aria-label="红色"></button>
          <button type="button" data-color="#ffb457" style="--c:#ffc53d" aria-label="橙色"></button>
          <button type="button" data-color="#6aa7ff" style="--c:#0090ff" aria-label="蓝色"></button>
          <button type="button" data-color="#64dcA2" style="--c:#64dca2" aria-label="绿色"></button>
          <button type="button" data-color="#ffffff" style="--c:#ffffff" aria-label="白色"></button>
          <button type="button" data-color="#171923" style="--c:#1c2024" aria-label="黑色"></button>
        </div>
      </div>
      <button class="tool-button" type="button" data-shortcut="z" data-action="undo" title="撤销"><kbd>Z</kbd><svg viewBox="0 0 24 24"><path d="M9 7H5v4M5.7 10.2A7 7 0 1 1 7 18"/></svg></button>
      <span class="tool-separator"></span>
      <button class="tool-button" type="button" data-shortcut="escape" data-action="cancel" title="取消"><kbd>Esc</kbd><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      <button class="tool-button" type="button" data-shortcut="q" data-action="pin" title="贴图"><kbd>Q</kbd><svg viewBox="0 0 24 24"><path d="m9 3 6 6-2 2 3 5-2 1-3-4-3 2 3-5-3-3 1-1Z"/><path d="m8 18-3 3"/></svg></button>
      <button class="tool-button" type="button" data-shortcut="s" data-action="save" title="保存"><kbd>S</kbd><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5V4Z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/></svg></button>
      <button class="token-button" type="button" data-action="ocr" data-shortcut="o" title="识别文字"><span>识</span><small>O</small></button>
      <button class="complete-button" type="button" data-action="copy" data-shortcut="enter"><svg viewBox="0 0 24 24"><path d="M8 8h11v11H8z"/><path d="M16 8V5H5v11h3"/></svg><span>完成</span><kbd>⏎</kbd></button>
    </div>

    <div class="action-toast" id="action-toast"></div>
    <div class="ocr-result" id="ocr-result" hidden>
      <header class="ocr-result-head">
        <div><b>识别结果</b></div>
        <button type="button" id="ocr-result-close" aria-label="关闭">×</button>
      </header>
      <textarea id="ocr-result-text" spellcheck="false" placeholder="正在识别…"></textarea>
      <footer class="ocr-result-actions">
        <button type="button" class="quiet" id="ocr-result-original">查看原图</button>
        <button type="button" class="quiet" id="ocr-result-retry">重新识别</button>
        <button type="button" class="quiet" id="ocr-result-shelf">加入任务匣</button>
        <button type="button" class="primary" id="ocr-result-copy">复制文字</button>
      </footer>
    </div>
    <div class="text-editor" id="text-editor" hidden>
      <textarea id="text-input" rows="2" placeholder="输入文字"></textarea>
      <div><button type="button" id="text-cancel">取消</button><button type="button" id="text-confirm">确定</button></div>
    </div>
    <div class="original-viewer" id="original-viewer" hidden>
      <header><b>原图</b><small>框选区域的原始画面，不含标注</small><button type="button" id="original-close" aria-label="关闭">×</button></header>
      <div class="original-stage"><img id="original-image" alt="框选区域原图"></div>
    </div>
    <div class="loading-state" id="loading-state"><span></span>正在获取屏幕画面…</div>
  </div>
  <script src="ui-motion.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
