<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; media-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none';">
  <title>随序 · 语音输入</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="voice-input.css">
</head>
<body>
  <main class="dictation" data-phase="opening">
    <button id="record" type="button" aria-label="结束录音并输入" title="点击结束录音">
      <svg id="wave" viewBox="0 0 100 28" width="100" height="28" aria-hidden="true"></svg>
    </button>
    <button id="notice" type="button" role="status" hidden></button>
    <button id="close" type="button" aria-label="取消语音输入" title="取消">×</button>
  </main>
  <script src="pcm-converter.js"></script>
  <script src="voice-input.js"></script>
</body>
</html>
