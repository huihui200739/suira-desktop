<!doctype html><html data-theme="mist" lang="zh-CN"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' file: data:; object-src 'none'; base-uri 'none'">
<title>随序 · 钉图</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="pin.css">
<link rel="stylesheet" href="ui-motion.css"><link rel="stylesheet" href="glass-select.css">
<link rel="stylesheet" href="action-strip.css">
</head><body>
<main id="pin-surface" class="pin-surface"><img id="pin-image" alt="钉在桌面的图片" draggable="false">
  <pre id="pin-text" class="pin-text" title="选中文字；按住 Ctrl 拖动窗口" hidden></pre>
  <button id="passthrough-unlock" class="pin-unlock" type="button" hidden title="点击退出鼠标穿透">穿透中 · 退出</button>
  <div id="pin-ocr-overlay" class="pin-ocr-overlay" hidden>
    <div id="pin-ocr-box" class="pin-ocr-box" hidden></div>
    <span class="pin-ocr-tip" id="pin-ocr-tip">拖拽框选文字 · 双击识别整图 · Esc 取消</span>
  </div>
  <div id="pin-ocr-result" class="pin-ocr-result" role="dialog" aria-label="钉图提字结果" hidden>
    <header><b>提字结果</b><button id="pin-ocr-copy" type="button">复制</button><button id="pin-ocr-close" type="button" aria-label="关闭">×</button></header>
    <textarea id="pin-ocr-text" readonly spellcheck="false"></textarea>
  </div>
  <div class="pin-bar" role="toolbar" aria-label="钉图工具">
    <div class="pin-adjust" role="group" aria-label="缩放"><button id="zoom-out" aria-label="缩小" title="缩小"><span data-icon="subtract" aria-hidden="true"></span></button><span class="pin-value" id="zoom-val">100%</span><button id="zoom-in" aria-label="放大" title="放大"><span data-icon="add" aria-hidden="true"></span></button></div>
    <div class="pin-adjust" role="group" aria-label="透明度"><button id="opacity-down" aria-label="更透明" title="更透明"><span data-icon="dark_theme" aria-hidden="true"></span></button><span class="pin-value" id="opacity-val">100%</span><button id="opacity-up" aria-label="更不透明" title="更不透明"><span data-icon="circle_half_fill" aria-hidden="true"></span></button></div>
    <button id="ocr-btn" aria-label="框选提字" title="框选提字 (O)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V4h4m8 0h4v4m0 8v4h-4M8 20H4v-4M8 9h8m-4 0v6"/></svg></button>
    <button id="passthrough-btn" aria-label="鼠标穿透" title="鼠标穿透 (T)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 4 6.5 16 2.5-5.5L19.5 12 5 4Z"/><path d="M15 15 20 20"/></svg></button>
    <button id="copy" aria-label="复制图片" title="复制图片"><span data-icon="copy" aria-hidden="true"></span></button><button id="more" aria-controls="pin-menu" aria-haspopup="menu" aria-expanded="false" aria-label="更多操作" title="更多操作"><span data-icon="more_horizontal" aria-hidden="true"></span></button><button id="collapse" aria-label="临时收起" title="临时收起"><span data-icon="subtract" aria-hidden="true"></span></button><button id="close" aria-label="关闭" title="关闭"><span data-icon="dismiss" aria-hidden="true"></span></button>
  </div>
  <button id="restore" hidden>展开钉图 <span data-icon="arrow_expand" aria-hidden="true"></span></button>
  <div class="pin-menu" id="pin-menu" role="menu" aria-label="钉图操作" hidden>
    <button role="menuitem" data-command="copy">复制图片 <kbd>Ctrl C</kbd></button>
    <button role="menuitem" data-command="save">图片另存为 <kbd>Ctrl S</kbd></button>
    <button role="menuitem" id="menu-ocr" data-command="ocr">框选提字 <kbd>O</kbd></button>
    <button role="menuitemcheckbox" id="passthrough-item" aria-checked="false" data-command="passthrough">鼠标穿透 <kbd>T</kbd></button>
    <div class="pin-compact-adjust" role="group" aria-label="缩放和透明度">
      <hr>
      <button role="menuitem" data-adjust="zoom-out">缩小 <span data-value="zoom"></span></button>
      <button role="menuitem" data-adjust="zoom-in">放大</button>
      <button role="menuitem" data-adjust="opacity-down">更透明 <span data-value="opacity"></span></button>
      <button role="menuitem" data-adjust="opacity-up">更不透明</button>
    </div>
    <hr><button role="menuitem" data-command="reset">恢复大小与透明度 <kbd>0</kbd></button>
    <button role="menuitemcheckbox" id="top-item" aria-checked="true" data-command="top">置于顶层 <span>✓</span></button>
    <button role="menuitem" data-command="collapse">临时收起 <kbd>双击</kbd></button><hr>
    <button role="menuitem" data-command="close">关闭钉图 <kbd>Esc</kbd></button>
  </div>
  <span class="pin-notice" id="pin-notice" role="status" hidden></span>
</main><script src="icons.js"></script><script src="ui-motion.js"></script><script src="pin.js"></script><script src="glass-select.js"></script><script src="action-strip.js"></script><script src="relay-surfaces.js"></script></body></html>
