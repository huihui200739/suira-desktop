<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; media-src 'self' blob:; img-src 'self' data:; object-src 'none'; base-uri 'none'">
  <title>随序 · 录屏</title>
  <link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="ui-motion.css"><link rel="stylesheet" href="recorder.css">
</head>
<body>
  <main class="recorder" id="recorder" data-phase="ready">
    <header class="recorder-head"><span class="record-mark" aria-hidden="true"></span><b id="heading">区域录屏</b><span id="region-size"></span><button id="close" aria-label="关闭">×</button></header>
    <section class="setup" id="setup"><label><input id="system-audio" type="checkbox"> 系统声音</label><label><input id="countdown" type="checkbox" checked> 3 秒倒计时</label><button class="primary" id="start">开始录制 <kbd>↵</kbd></button></section>
    <section class="live" id="live" hidden><span class="live-dot" aria-hidden="true"></span><strong id="elapsed">00:00</strong><span id="status" role="status">正在录制</span><button id="pause">暂停</button><button class="stop" id="stop"><i aria-hidden="true"></i>结束</button></section>
    <section class="done" id="done" hidden><span id="file-name"></span><div><button id="open">播放视频</button><button id="reveal">打开文件夹</button><button class="primary" id="export">另存为</button></div></section>
    <p id="notice" role="status">仅录制所选区域</p>
  </main>
  <script src="ui-motion.js"></script><script src="recorder.js"></script>
</body>
</html>
