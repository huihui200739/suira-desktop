<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <title>随序 文件中转</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="island.css">
</head>
<body>
  <!--
    浮引岛：屏幕顶部中央的文件暂存浮层，默认休眠。
    三态由主进程改窗口尺寸、渲染层切 data-mode：
      休眠隐藏且鼠标穿透；拖动经过顶部中央 440×36 时短暂启用透明接收区。
      确认文件拖入后显示 440×108 接收区，有内容时展开 520×148 贴边托盘。
      不显示旧胶囊；手动入口仍在工具箱与托盘。
    所有内容都在这三个尺寸内排布，根元素裁掉溢出，不出现滚动条。
  -->
  <main class="island" id="island" data-mode="sleep" data-expanded="false" data-policy="copy" aria-label="文件中转（浮引岛）">
    <!-- 胶囊态：岛图标 + 文件数 + 当前策略 -->
    <button class="rail" id="rail" type="button" title="文件中转：点一下展开，也可以直接把文件拖到屏幕顶部">
      <span class="rail-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="6" width="17" height="4" rx="2"/><path d="M5.5 12.5h13l-1.4 5.2a2 2 0 0 1-1.9 1.3H8.8a2 2 0 0 1-1.9-1.3z"/></svg>
      </span>
      <span class="rail-count" id="rail-count">0</span>
      <span class="rail-policy" id="rail-policy">复制</span>
    </button>

    <!-- 展开态：文件卡片网格 + 底部策略切换与清空 -->
    <section class="sheet" id="sheet" hidden aria-label="暂存文件">
      <div class="shelf-wrap">
        <div class="shelf" id="shelf" role="list" aria-label="暂存文件列表"></div>
        <div class="empty" id="empty" data-mode="empty">
          <span class="drop-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v11m-4-4 4 4 4-4M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg></span>
          <div class="drop-copy"><b id="empty-title">把文件拖进来暂存</b><p id="empty-hint">从资源管理器拖入，切换窗口后再取用。</p></div>
          <button class="retry-btn" id="retry" type="button" hidden>重试</button>
        </div>
      </div>
      <footer class="sheet-foot">
        <span class="foot-count" id="foot-count">暂存 0 个</span>
        <div class="policy" role="group" aria-label="拖放偏好" title="实际复制或移动由目标应用决定">
          <button class="policy-btn is-active" id="policy-copy" type="button" data-policy="copy" aria-pressed="true">复制</button>
          <button class="policy-btn" id="policy-move" type="button" data-policy="move" aria-pressed="false">移动</button>
        </div>
        <button class="clear-btn" id="undo" type="button" title="找回本次运行中最近移除或清空的文件引用" disabled>撤销</button>
        <button class="clear-btn" id="clear" type="button" title="清空暂存引用，不删除原文件" disabled>清空</button>
      </footer>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="island.js"></script>
</body>
</html>
