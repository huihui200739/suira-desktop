  <script>
  (() => {
    const root = document.getElementById('suira-keycap-study');
    const keys = Array.from(root.querySelectorAll('[data-tool]'));
    const poseButtons = Array.from(root.querySelectorAll('[data-pose]'));
    const output = root.querySelector('output');
    const preferences = { lift:3, tilt:3, motion:true };
    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    let pose = 'live';
    let active = null;
    const pending = new Map();
    const timers = new Map();
    let raf = 0;
    function clearKey(key) {
      clearTimeout(timers.get(key));
      timers.delete(key);
      pending.delete(key);
      key.classList.remove('engaged','pressed');
      key.style.removeProperty('--rx');
      key.style.removeProperty('--ry');
    }
    function resetLive() {
      if(pose !== 'live') return;
      keys.forEach(clearKey);
      active=null;
    }
    root.addEventListener('pointerleave',resetLive);
    document.addEventListener('pointerout',event => { if(!event.relatedTarget) resetLive(); });
    window.addEventListener('blur',resetLive);
    function applyPreferences() {
      root.dataset.motion = preferences.motion ? 'on' : 'off';
      keys.forEach(key => {
        key.querySelector('.cap').style.setProperty('--lift',preferences.lift + 'px');
      });
      applyPose();
    }
    function applyPose() {
      keys.forEach(clearKey);
      const target = keys[0];
      if (pose === 'hover') { target.classList.add('engaged'); target.style.setProperty('--rx','-2deg'); target.style.setProperty('--ry','2deg'); }
      if (pose === 'press') target.classList.add('pressed');
      poseButtons.forEach(button => button.setAttribute('aria-pressed',String(button.dataset.pose === pose)));
      output.textContent = pose === 'live' ? '实时交互' : '翻译 · ' + (pose === 'hover' ? '悬停状态' : '按下状态');
    }
    function savePose() {
      const host = window.openai;
      if (host && typeof host.setWidgetState === 'function') {
        const result = host.setWidgetState({modelContent:{study:'随序键位材质',pose},privateContent:null});
        if (result && typeof result.catch === 'function') result.catch(() => {});
      }
    }
    poseButtons.forEach(button => button.addEventListener('click',() => { pose=button.dataset.pose; applyPose(); savePose(); }));
    keys.forEach(key => {
      key.addEventListener('pointerenter',event => {
        if (pose !== 'live' || event.pointerType === 'touch') return;
        active=key;
        timers.set(key,setTimeout(() => { if(active===key) key.classList.add('engaged'); },120));
      });
      key.addEventListener('pointermove',event => {
        if (pose !== 'live' || reduced.matches || !preferences.motion || event.pointerType === 'touch') return;
        const bounds=key.querySelector('.key-stage').getBoundingClientRect();
        const x=Math.max(-1,Math.min(1,(event.clientX-bounds.left)/bounds.width*2-1));
        const y=Math.max(-1,Math.min(1,(event.clientY-bounds.top)/bounds.height*2-1));
        pending.set(key,{x,y});
        if(!raf) raf=requestAnimationFrame(() => {
          pending.forEach((point,item) => {
            item.style.setProperty('--rx',(-point.y*preferences.tilt).toFixed(2)+'deg');
            item.style.setProperty('--ry',(point.x*preferences.tilt).toFixed(2)+'deg');
          });
          pending.clear(); raf=0;
        });
      });
      key.addEventListener('pointerleave',() => { if(pose==='live') { clearKey(key); if(active===key) active=null; } });
      key.addEventListener('pointerdown',() => { if(pose==='live') key.classList.add('pressed'); });
      key.addEventListener('pointerup',() => { if(pose==='live') key.classList.remove('pressed'); });
      key.addEventListener('pointercancel',() => { if(pose==='live') clearKey(key); });
      key.addEventListener('keydown',event => { if(pose==='live' && [' ','Enter'].includes(event.key)) key.classList.add('pressed'); });
      key.addEventListener('keyup',() => { if(pose==='live') key.classList.remove('pressed'); });
      key.addEventListener('blur',() => { if(pose==='live') clearKey(key); });
      key.addEventListener('click',() => { if(pose==='live') output.textContent=key.querySelector('.key-name').textContent+' · 按压反馈'; });
    });
    const saved = window.openai && window.openai.widgetState;
    if(saved && saved.modelContent && ['live','hover','press'].includes(saved.modelContent.pose)) pose=saved.modelContent.pose;
    window.addEventListener('openai:set_globals',event => {
      const state=event.detail && event.detail.globals && event.detail.globals.widgetState;
      if(state && state.modelContent && ['live','hover','press'].includes(state.modelContent.pose)) { pose=state.modelContent.pose; applyPose(); }
    });
    applyPreferences();
    if(globalThis.Tweak) {
      const tweak=new Tweak({container:root.querySelector('.study-product'),onChange:applyPreferences});
      tweak.addSlider(preferences,'lift',{label:'抬升高度',min:0,max:5,step:1,unit:'px'});
      tweak.addSlider(preferences,'tilt',{label:'倾斜幅度',min:0,max:5,step:1,unit:'°'});
      tweak.addToggle(preferences,'motion',{label:'立体反馈'});
    }
  })();
  </script>
</div>
