name: Build Windows update release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      UPDATE_RELEASE_TOKEN: ${{ secrets.UPDATE_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify version tag
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
          "number=$version" >> $env:GITHUB_OUTPUT
      - run: npm test
      - run: npm run verify:launcher
      - name: Build update bundle
        run: npm run dist
      - run: node tools/release-package-check.js
      - name: Upload verified draft to public distribution repository
        if: env.UPDATE_RELEASE_TOKEN != ''
        run: npm run release:updates -- --draft
      - uses: actions/upload-artifact@v4
        with:
          name: windows-update
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/win-unpacked/resources/app-update.yml
            docs/release-${{ steps.version.outputs.number }}.json
